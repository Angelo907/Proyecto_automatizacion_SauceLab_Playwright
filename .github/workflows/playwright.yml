name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente a probar"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
  schedule:
    - cron: "0 6 * * 5"
jobs:
  test:
    timeout-minutes: 60
    # environment es el que hace que GitHub ponga a disposición del job los
    # Environment Secrets y Environment Variables.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || github.event_name == 'schedule' && 'uat' || 'dev' }}
    # "GitHub, dame un runner Linux administrado por GitHub. tipo de máquina donde se ejecutará el job"
    runs-on: ubuntu-latest
    # Ejecuta los pasos de este job dentro de este contenedor.
    # Playwright proporciona imágenes Docker preconstruidas para CI.
    # Su documentación contempla precisamente el uso de imágenes Docker
    # como alternativa a instalar las dependencias de navegador en el runner.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      # Trae el código del repositorio a la máquina que está ejecutando el job.
      - uses: actions/checkout@v4
      # setup-node coloca la versión de Node
      # configurada en el PATH del job y permite además cachear dependencias de npm
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome channel
        run: npx playwright install chrome

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests (solo Chrome)
        run: npx playwright test --project="Google Chrome"
        env:
          # variable de configuración.
          BASE_URL: ${{ vars.BASE_URL }}
          # secrets de configuración.
          SAUCE_USER: ${{ secrets.SAUCE_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Los tests de Playwright fallaron. Revisa el reporte en los artifacts de esta ejecución."
